<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Diff Viewer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
    <link rel="stylesheet" href="/diff/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Git Diff</h2>
        <ul id="session-list"></ul>
      </aside>
      <div class="resizer" id="sidebar-resizer" aria-hidden="true"></div>
      <main class="content">
        <div class="toolbar">
          <div id="current-session-meta">
            <span id="current-session">Select a session to view git diff</span>
            <span id="current-session-folder"></span>
          </div>
          <div id="toolbar-actions">
            <input id="commit-message" type="text" placeholder="Commit message" />
            <button id="commit-diff" type="button">Commit</button>
            <button id="refresh-diff" type="button">Refresh</button>
          </div>
        </div>
        <div id="data-view">
          <div id="status" class="placeholder">Select a session from the sidebar to inspect git diff.</div>
          <div id="diff-output"></div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>
    <script type="module" src="/diff/app.js"></script>
  </body>
</html>
