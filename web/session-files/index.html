<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Session Files</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/session-files/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Session files</h2>
        <ul id="session-list"></ul>
      </aside>
      <div class="resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
      <main class="content">
        <div class="toolbar">
          <span id="current-session">Select a session to view files</span>
          <div id="toolbar-actions">
            <button id="refresh-session-files" type="button">Refresh</button>
          </div>
        </div>
        <div id="data-view">
          <p class="placeholder">Select a session from the sidebar to inspect files.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/session-files/app.js"></script>
  </body>
</html>
