<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Todos Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/todos/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Todos</h2>
        <ul id="session-list"></ul>
      </aside>
      <div
        class="resizer"
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main class="content">
        <div class="toolbar">
          <span id="current-session">Select a todo session to view its data</span>
          <div id="toolbar-actions">
            <select id="table-select" disabled>
              <option value="">Select table</option>
            </select>
            <button id="refresh-todos" type="button">Refresh</button>
            <div class="app-menu">
              <button id="app-menu-button" type="button" class="icon-button" aria-label="Open app menu" aria-haspopup="menu" aria-expanded="false">
                <span class="app-grid-icon" aria-hidden="true">
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                </span>
              </button>
              <div id="app-menu" class="menu-popup" role="menu" hidden></div>
            </div>
          </div>
        </div>
        <div id="data-view">
          <p class="placeholder">Select a todo session from the sidebar to inspect its internal state.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/todos/app.js"></script>
  </body>
</html>
