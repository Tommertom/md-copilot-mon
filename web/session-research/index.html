<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Session Research</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/session-research/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Session research</h2>
        <ul id="session-list"></ul>
      </aside>
      <div class="resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
      <main class="content">
        <div class="toolbar">
          <span id="current-session">Select a session to view research</span>
          <div id="toolbar-actions">
            <button id="refresh-session-research" type="button">Refresh</button>
            <div class="app-menu">
              <button id="app-menu-button" type="button" class="icon-button" aria-label="Open app menu" aria-haspopup="true" aria-expanded="false" aria-controls="app-menu">
                <span class="app-grid-icon" aria-hidden="true">
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                </span>
              </button>
              <div id="app-menu" class="menu-popup" hidden></div>
            </div>
          </div>
        </div>
        <div id="data-view">
          <p class="placeholder">Select a session from the sidebar to inspect research files.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/session-research/app.js"></script>
  </body>
</html>
