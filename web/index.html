<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Copilot Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Markdown files</h2>
        <input
          id="file-search"
          type="text"
          placeholder="Search files..."
          aria-label="Search markdown files"
        />
        <ul id="file-list"></ul>
      </aside>
      <main class="content">
        <div class="toolbar">
          <span id="current-file"></span>
          <div id="toolbar-actions">
            <button id="save-file" disabled>Save</button>
            <button id="copy-md" disabled>Copy MD</button>
            <button id="paste-md" disabled>Paste MD</button>
            <button id="download-docx" disabled>Download DOCX</button>
            <div class="app-menu">
              <button
                id="app-menu-button"
                type="button"
                class="icon-button"
                aria-label="Open app menu"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <span class="app-grid-icon" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </span>
              </button>
              <div id="app-menu" class="menu-popup" role="menu" hidden>
                <button
                  id="menu-open-main-popout"
                  type="button"
                  class="menu-item"
                  role="menuitem"
                >
                  <span class="menu-item-content">
                    <span>pop out</span>
                    <span class="menu-item-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16">
                        <path
                          d="M3 4.5A1.5 1.5 0 0 1 4.5 3h4a.75.75 0 0 1 0 1.5h-4v7h7v-4a.75.75 0 0 1 1.5 0v4A1.5 1.5 0 0 1 11.5 13h-7A1.5 1.5 0 0 1 3 11.5zM9 3h3.25A.75.75 0 0 1 13 3.75V7a.75.75 0 0 1-1.5 0V5.56l-3.97 3.97a.75.75 0 1 1-1.06-1.06l3.97-3.97H9A.75.75 0 0 1 9 3"
                        ></path>
                      </svg>
                    </span>
                  </span>
                </button>
                <button
                  id="menu-open-diff-viewer"
                  type="button"
                  class="menu-item"
                  role="menuitem"
                >
                  Git Diff
                </button>
                <button
                  id="menu-open-todos"
                  type="button"
                  class="menu-item"
                  role="menuitem"
                >
                  Todos
                </button>
                <button
                  id="menu-open-events"
                  type="button"
                  class="menu-item"
                  role="menuitem"
                >
                  Events
                </button>
                 <button
                   id="menu-open-session-files"
                   type="button"
                   class="menu-item"
                   role="menuitem"
                 >
                    Files
                 </button>
                 <button
                   id="menu-open-session-checkpoints"
                   type="button"
                   class="menu-item"
                   role="menuitem"
                 >
                    Checkpoints
                 </button>
                 <button
                   id="menu-open-session-research"
                   type="button"
                   class="menu-item"
                   role="menuitem"
                >
                   Research
                </button>
              </div>
            </div>
          </div>
        </div>
        <article
          id="editor"
          contenteditable="false"
          aria-label="Markdown editor"
          spellcheck="true"
        >
          <p>Select a markdown file to edit...</p>
        </article>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.min.js"></script>
    <script type="module" src="/app.js"></script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      window.__mermaid = mermaid;
    </script>
  </body>
</html>
