<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Copilot Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Markdown files</h2>
        <input id="file-search" type="text" placeholder="Search files..." aria-label="Search markdown files" />
        <ul id="file-list"></ul>
      </aside>
      <main class="content">
          <div class="toolbar">
            <span id="current-file"></span>
            <div id="toolbar-actions">
              <button id="save-file" disabled>Save</button>
              <button id="copy-md" disabled>Copy to Clipboard</button>
              <button id="paste-md" disabled>Paste MD</button>
              <button id="download-docx" disabled>Download as DOCX</button>
              <div class="app-menu">
                <button
                  id="app-menu-button"
                  type="button"
                  class="icon-button"
                  aria-label="Open app menu"
                  aria-haspopup="menu"
                  aria-expanded="false"
                >
                  <span class="app-grid-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                  </span>
                </button>
                <div id="app-menu" class="menu-popup" role="menu" hidden>
                  <button id="menu-open-diff-viewer" type="button" class="menu-item" role="menuitem">
                    View Git Diff
                  </button>
                </div>
              </div>
            </div>
          </div>
        <article id="editor" contenteditable="false" aria-label="Markdown editor" spellcheck="true">
          <p>Select a markdown file to edit...</p>
        </article>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.min.js"></script>
    <script type="module" src="/app.js"></script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      window.__mermaid = mermaid;
    </script>
  </body>
</html>
